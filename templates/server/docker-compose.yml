# Local development stack: MongoDB (single-node replica set, ready for transactions) and Redis.
# Everything is bound to 127.0.0.1.
#
#   cp docker/compose.env.example .env       # fill in the values
#   docker compose up -d                     # infrastructure only
#   docker compose --profile app up --build  # plus the API container
#
# Credentials are never written here: they come from `.env` (git-ignored).

name: __SYSTEM_SLUG__-server

services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once a primary exists.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
          | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env.development
        required: false
    environment:
      NODE_ENV: development
      PORT: '3000'
      # Service names replace localhost inside the compose network.
      MONGODB_URI: mongodb://mongo:27017/__SYSTEM_SLUG__?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'

volumes:
  mongo-data:
  redis-data:
