# AcmeShop CI (T-025). Runs only when the customer app (or this workflow) changes.
# Gates (CLAUDE.md §1): policy checks (hardcoded values, AR+EN resources, 300-line files, variants, crash-prone and
# slow constructs, config security), detekt + Compose rules, secret scan, every Android variant (assemble + lint +
# unit tests + R8/APK-size budget) and every iOS configuration (xcodebuild + Kotlin/Native tests + SwiftLint).
name: Customer App CI

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: customer-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  policy:
    name: Policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Policy script tests
        run: python3 -m unittest discover -s scripts/ci/tests -p "test_*.py"
      # Hardcoded values, file length, localization, build variants, quality/performance rules, config security.
      - name: Policy checks
        run: python3 scripts/ci/policy_checks.py all

  lint:
    name: Kotlin lint (detekt and Compose rules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kmp-app-lint
          key: kmp-app-lint-${{ hashFiles('scripts/ci/run_detekt.sh') }}
      - name: detekt
        run: scripts/ci/run_detekt.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt.txt
          if-no-files-found: ignore

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks lists the pull request's commits to scan only the new ones.
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android ${{ matrix.flavor }} ${{ matrix.buildType }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: dev, buildType: debug, task: DevDebug }
          - { flavor: dev, buildType: release, task: DevRelease }
          - { flavor: prod, buildType: debug, task: ProdDebug }
          - { flavor: prod, buildType: release, task: ProdRelease }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble
        run: ./gradlew :androidApp:assemble${{ matrix.task }} --stacktrace
      - name: Android Lint (warnings are errors)
        run: ./gradlew :androidApp:lint${{ matrix.task }} --stacktrace
      - name: Print Android Lint findings
        if: failure()
        run: cat androidApp/build/reports/lint-results-*.txt 2>/dev/null | head -300 || true
      # commonTest of every module, run on the JVM.
      - name: Unit tests
        if: matrix.task == 'DevDebug'
        run: ./gradlew testAndroidHostTest --stacktrace
      - name: Performance budget (R8 mapping and APK size)
        if: matrix.buildType == 'release'
        run: python3 scripts/ci/policy_checks.py budget --flavor ${{ matrix.flavor }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ matrix.task }}
          path: |
            androidApp/build/reports
            **/build/reports/tests
          if-no-files-found: ignore

  ios:
    name: iOS ${{ matrix.scheme }} ${{ matrix.configuration }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scheme: iosApp-Dev, configuration: Debug-Dev }
          - { scheme: iosApp-Dev, configuration: Release-Dev }
          - { scheme: iosApp-Prod, configuration: Debug-Prod }
          - { scheme: iosApp-Prod, configuration: Release-Prod }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # The Xcode "Compile Kotlin Framework" phase runs Gradle; warnings are errors (see the project build settings).
      - name: Build for the iOS simulator
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme ${{ matrix.scheme }}
          -configuration ${{ matrix.configuration }}
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Kotlin/Native unit tests
        if: matrix.configuration == 'Debug-Dev'
        run: ./gradlew iosSimulatorArm64Test --stacktrace
      - name: SwiftLint
        if: matrix.configuration == 'Debug-Dev'
        run: |
          brew install swiftlint
          swiftlint lint --strict --config config/swiftlint.yml

  # One stable check to require in branch protection.
  customer-ci-passed:
    name: Customer CI passed
    if: always()
    needs: [policy, lint, secret-scan, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require every job to succeed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "A required job did not succeed" >&2
            exit 1
          fi
