#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx8g
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#App version (CI may override with -P)
APP_VERSION_NAME=1.0
APP_VERSION_CODE=1

#Environments (PLACEHOLDER hosts until the platform domain is decided; override locally in local.properties)
DEV_API_BASE_URL=https://api-dev.example.com
DEV_WEB_BASE_URL=https://app-dev.example.com
PROD_API_BASE_URL=https://api.example.com
PROD_WEB_BASE_URL=https://app.example.com
# Dev installs next to prod (com.acme.shop.dev); each flavor has its own google-services.json (docs/FIREBASE_SETUP.md)
DEV_APPLICATION_ID_SUFFIX=.dev
# Data source per flavor: fixtures (mock) or the real API (remote); prod must stay remote.
DEV_DATA_SOURCE=mock
PROD_DATA_SOURCE=remote
PROD_APPLICATION_ID_SUFFIX=

org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.daemon=true