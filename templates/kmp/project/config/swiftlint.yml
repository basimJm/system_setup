# SwiftLint policy for the iOS host (CLAUDE.md §1.7); run with --strict so warnings fail CI.
included:
  - iosApp/iosApp
excluded:
  - iosApp/iosApp/Assets.xcassets
opt_in_rules:
  - force_unwrapping
  - empty_count
  - explicit_init
  - first_where
line_length:
  warning: 140
  error: 160
file_length:
  warning: 300
  error: 300
